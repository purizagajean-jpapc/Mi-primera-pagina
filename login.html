<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema ERP - MAQUIPESA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-6">

  <div class="w-full max-w-md bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-flex bg-amber-500 p-3 rounded-xl text-slate-900 mb-2">
        <i data-lucide="truck" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-black tracking-wider text-white">MAQUIPESA ERP</h1>
      <p class="text-slate-400 text-sm">Ingrese sus credenciales para acceder al panel de control</p>
    </div>

    <form onsubmit="iniciarSesion(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Correo Electrónico</label>
        <input type="email" required placeholder="admin@maquipesa.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Contraseña</label>
        <input type="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>

      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3.5 rounded-xl transition shadow-lg text-sm flex items-center justify-center gap-2">
        <i data-lucide="log-in" class="w-4 h-4"></i> Iniciar Sesión
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="index.html" class="text-xs text-slate-400 hover:text-amber-400 transition inline-flex items-center gap-1">
        ← Volver a la página comercial
      </a>
    </div>
  </div>

  <script>
    lucide.createIcons();

    function iniciarSesion(e) {
      e.preventDefault();
      // Redirige al dashboard tras iniciar sesión
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
